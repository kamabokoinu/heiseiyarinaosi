<style>

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;

header{display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}

.role{font-size:13px;color:var(--muted)}
.track{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.track .now{border-color:var(--ink);color:var(--ink);font-weight:700}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}

.g{background:var(--paper);padding:10px 12px;display:grid;gap:2px;align-content:start}
.g .lb{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.g .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}

.up{color:var(--good)} .dn{color:var(--bad)}
.bar{height:4px;background:var(--rule);margin-top:4px}

.doc{background:var(--paper);border:1px solid var(--ink);padding:22px 20px 20px;position:relative;display:grid;gap:14px}
.doc .date{font-family:var(--f-display);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.doc h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.3;margin:0;text-wrap:balance;padding-right:64px}
.sesou{font-size:13px;color:var(--muted);border-left:2px solid var(--rule);padding-left:10px}
.sit{margin:0;max-width:62ch}
.opts{display:grid;gap:10px}

.stamp{position:absolute;top:16px;right:16px;width:58px;height:58px;border:3px solid var(--seal);color:var(--seal);border-radius:50%;

.res{margin:0;max-width:62ch}
.extra{margin:0;max-width:62ch;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--rule);font-variant-numeric:tabular-nums}

.pager{background:var(--lcd-bg);color:var(--lcd-ink);font-family:var(--f-lcd);padding:10px 14px;border:3px solid var(--ink);border-radius:6px;

.pager small{font-size:12px;opacity:.8}

.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ink);color:var(--paper);padding:10px 20px;font-weight:700;letter-spacing:.06em}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right}
.verdict{font-family:var(--f-display);font-size:clamp(20px,4vw,26px);font-weight:800;line-height:1.4;margin:0;text-wrap:balance}
.risk{display:inline-block;padding:0 8px;color:var(--paper);font-weight:700}
.risk.h{background:var(--bad)} .risk.m{background:var(--muted)} .risk.l{background:var(--good)}
ul.memos{margin:0;padding-left:1.2em;display:grid;gap:4px}
.note{font-size:12px;color:var(--muted);margin:0}
h3{font-size:14px;margin:0;letter-spacing:.06em}
.sec{display:grid;gap:8px}
.restart{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-self:start;font-size:13px}
.restart button{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 12px;border:1px solid var(--ink);font-size:13px;font-weight:700}
.restart button.yes{background:var(--seal);border-color:var(--seal);color:var(--paper)}
.restart button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>

<div class="wrap">

    <h1>平成やり直し</h1>

    <div class="restart" id="restart"></div>
  </header>

<script>
const CHAPTERS=[
 {n:1,name:"第1章　バブル絶頂と崩壊",span:"1989–1992",from:0,to:5},
 {n:2,name:"第2章　政治の地殻変動",span:"1993–1995",from:6,to:10},
 {n:3,name:"第3章　金融危機",span:"1996–1999",from:11,to:16}
];
const chOf=i=>CHAPTERS.find(c=>i>=c.from&&i<=c.to);
const ROLE={aide:"首相側近",opp:"野党議員",min:"大蔵大臣",party:"与党の政策幹部"};
const ROLE_BONUS={aide:0,opp:-10,min:10,party:5};
const pressure=s=>s.npl+(s.tax?8:0);

const EVENTS=[
 /* ---------- 第1章 ---------- */

  opts:[
   {t:"日銀に任せる（急ピッチの連続利上げ）",tag:"史実",fx:{bubble:-30,npl:20,poll:2},memo:"1989 急ピッチの利上げを容認",
    res:"日銀は急ピッチで利上げを重ねる。過熱は冷めるが、急ブレーキの反動で何かが積み上がり始めた。"},
   {t:"小刻みに、時間をかけた利上げを進言する",tag:"進言",bonus:0,
    ok:{fx:{bubble:-15,npl:5,trust:3},memo:"1989 段階的な利上げ",res:"首相があなたの案を日銀に伝え、利上げは小刻みに進むことになった。株価の下げは緩やかになりそうだ。"},
    ng:{fx:{bubble:-30,npl:20,poll:2,trust:-3},rej:"段階的な利上げ",memo:"1989 急ピッチの利上げを容認",res:"「日銀には独立性がある」と首相は動かず、利上げは急ピッチで進む。"}},
   {t:"景気を優先し、利上げ見送りを進言する",tag:"進言",bonus:-5,
    ok:{fx:{bubble:10,npl:12,poll:-6},memo:"1989 利上げを見送り",res:"利上げは見送られた。株価はさらに上がるが、マイホームを諦める人々の怒りが広がる。"},
    ng:{fx:{bubble:-30,npl:20,poll:2,trust:-2},memo:"1989 急ピッチの利上げを容認",res:"首相は首を振った。日銀は急ピッチで利上げを重ねる。"}}
  ]},
 {when:"平成元年（1989年）9月",short:"89.9",title:"米国の象徴を、日本企業が買う",

  sit:"日本企業がニューヨークの名門ビルやハリウッドの映画会社を次々に買収。米国では「魂を買われた」と反発が強まっている。",
  opts:[
   {t:"民間の自由として静観する",tag:"史実",fx:{bubble:3,intl:-8},res:"買収は続き、米議会では対日批判が強まっていく。"},
   {t:"財界の人脈を通じて、目立つ買収の自粛を働きかける",tag:"別ルート",fx:{bubble:-4,intl:5,trust:-2},
    res:"大型案件の一部が見直された。財界からは「余計な口出しだ」と不満の声。"},
   {t:"公共投資で内需を広げ、貿易黒字を減らすよう進言する",tag:"進言",bonus:0,
    ok:{fx:{intl:6,fiscal:-8,bubble:4},res:"公共投資の積み増しが決まった。米国の反発はやや和らぐが、財政と景気の過熱に負担が残る。"},
    ng:{fx:{bubble:3,intl:-8},res:"首相は財政規律を優先した。買収は続き、対日批判が強まる。"}}
  ]},
 {when:"平成2年（1990年）3月",short:"90.3",title:"不動産融資に「総量規制」",

  opts:[
   {t:"総量規制を即時に実施させる",tag:"史実",fx:{bubble:-30,npl:30,poll:5},memo:"1990 総量規制を即時実施",
    res:"銀行の不動産融資は一気に絞られた。地価はやがて急落に向かう。この急ブレーキは、のちに大きなツケを残すかもしれない。"},
   {t:"段階的な導入を大蔵省と調整する",tag:"進言",bonus:15,
    ok:{fx:{bubble:-20,npl:8,trust:5},memo:"1990 総量規制を段階導入",res:"規制は数年かけて段階的に導入される。地価は高止まりするが、急落の衝撃はやわらいだ。"},

   {t:"派閥と業界を動かし、規制を見送らせる",tag:"別ルート",fx:{bubble:5,npl:15,poll:-10,trust:-8},memo:"1990 総量規制を見送り",

  ]},

   {t:"超党派の議員連盟で、火山防災の予算を確保する",tag:"別ルート",fx:{trust:-3,fiscal:-3,crisis:1,poll:2},memo:"1990 火山防災の予算を確保",

  ]},
 {when:"平成3年（1991年）1月",short:"91.1",title:"湾岸戦争、開戦",
  sesou:"空爆の映像がテレビゲームのようだと話題になった。",
  sit:"多国籍軍がイラクへの攻撃を開始した。日本には資金だけでなく「汗をかく貢献」を求める声が、米国から届いている。",
  opts:[
   {t:"資金協力に徹する",tag:"史実",fx:{fiscal:-10,intl:-6},memo:"1991 湾岸は資金協力のみ",

 /* ---------- 第2章 ---------- */

  return {k:"roll",c:clamp(Math.round(25+s.trust*.6+(o.bonus||0)+ROLE_BONUS[s.role]+(o.dyn?o.dyn(s):0)),10,90)};
}
function addFx(n,fx){for(const [k,v] of Object.entries(fx||{})){ if(k==="nplMul") n.npl=Math.round(n.npl*v); else n[k]=(n[k]||0)+v; }}
function resolve(s,i,oi,roll){
  const e=ev(s,i), o=e.opts[oi], m=mode(s,o); let br, adopted=null;
  if(m.k==="fixed") br=o; else if(m.k==="direct"){br=o.ok;adopted=true} else {adopted=roll<m.c; br=adopted?o.ok:o.ng}
  const n=cp(s);
  if(e.fc) n.fc=e.fc;
  addFx(n,e.extra); addFx(n,br.fx);
  if(br.set) Object.assign(n,br.set);
  const ch=chOf(i).n;
  if(ch===1){ if(i>=2) n.bubble-=3; }
  else {
    if(n.bubble>60){ n.npl+=6; n.bubble-=5; }
    else if(n.npl<30) n.bubble+=2;
    n.npl+=Math.round(n.npl*.06); if(n.bubble<20) n.jobs-=1;
    n.poll+=Math.round((40-n.poll)*.15);
  }
  n.bubble=clamp(n.bubble,0,100);
  n.landHeat+=(n.bubble-n.landHeat)*.5;
  n.poll=clamp(n.poll,5,80); for(const k of ["trust","intl","fiscal","jobs"]) n[k]=clamp(n[k],0,100);
  n.npl=Math.max(0,n.npl);
  if(br.memo) n.memos.push(br.memo);
  if(br.rej) n.rejected.push(br.rej);
  const res=typeof br.res==="function"?br.res(n):br.res;
  const extra=e.after?e.after(n):"";
  n.step=i+1;
  return {n,res,extra,adopted,direct:m.k==="direct",memo:br.memo};
}
function vindicate(s){
  const n=cp(s);
  for(const r of n.rejected) if(RIGHT.includes(r)&&!n.vind.includes(r)){n.vind.push(r);n.trust=clamp(n.trust+5,0,100)}
  return n;
}
const HIST=(()=>{let s=cp(S0);EVENTS.forEach((e,i)=>{s=resolve(s,i,0,0).n;if(i===5||i===10)s=vindicate(s)});return s})();

let st,phase,last,prev;
function start(d){st=d.st||cp(S0);phase=d.phase||"event";last=d.last||null;prev=d.prev||null;render()}
window.claude?.hot?.snapshot?.(()=>({st,phase,last,prev}));

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const roleLabel=s=>s.role==="min"&&s.path==="new"?"連立政権の大蔵大臣":ROLE[s.role];
function curCh(){
  if(phase==="report"||phase==="final") return chOf(Math.max(0,st.step-1));
  return chOf(Math.min(st.step,EVENTS.length-1));
}
function renderTrack(){
  const c=curCh();
  $("eyebrow").textContent=c.name+"　"+c.span;
  let h="";
  for(let i=c.from;i<=c.to;i++){
    const cls=i<st.step?"done":(i===st.step&&(phase==="event"))?"now":"";
    h+=`<span class="${cls}">${EVENTS[i].short}</span>`;
  }
  h+=`<span class="${phase==="report"||phase==="final"?"now":""}">章末</span>`;
  $("track").innerHTML=h;
}
function renderBoard(){
  const tiles=METRICS.map(m=>{
    const v=m.f(st), p=prev?m.f(prev):null, d=(p===null||phase!=="result")?0:v-p;
    const ds=d?`<span class="${d>0?"up":"dn"}">${d>0?"▲":"▼"} ${Math.abs(d).toLocaleString("ja-JP")}</span>`:"";
    return `<div class="g"><span class="lb">${m.lb}</span><span class="v">${m.fmt(v)}</span>${m.bar?`<div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div>`:""}<span class="d">${ds}</span></div>`;
  });
  const rc=prev&&phase==="result"&&prev.role!==st.role;
  tiles.push(`<div class="g"><span class="lb">あなたの立場</span><span class="v txt">${roleLabel(st)}</span><span class="d">${rc?'<span class="up">異動</span>':""}</span></div>`);
  $("board").innerHTML=tiles.join("");
}
function renderEvent(){
  const e=ev(st,st.step);
  $("main").innerHTML=`<article class="doc">
    <div class="date">${e.when}</div>
    <h2>${e.title}</h2>
    <div class="sesou">世相｜${e.sesou}</div>
    <p class="sit">${e.sit}</p>
    <div class="opts">${e.opts.map((o,i)=>{
      const m=mode(st,o);
      let cls="",label=o.tag;
      if(m.k==="direct"){cls="dir";label="大臣として決定"}
      else if(m.k==="roll"){cls="adv";label=(st.role==="opp"?"党として提言":"進言")+`｜採用の見込み ${m.c}%`}
      else if(o.tag==="別ルート") cls="alt";
      return `<button class="opt" id="opt${i}" data-i="${i}"><span class="tag ${cls}">${label}</span><span class="t">${esc(o.t)}</span></button>`}).join("")}</div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}
function choose(oi){
  const e=ev(st,st.step);
  prev=st; const r=resolve(st,st.step,oi,Math.random()*100);
  last={i:st.step,title:e.title,when:e.when,t:e.opts[oi].t,res:r.res,extra:r.extra,adopted:r.adopted,direct:r.direct,memo:r.memo,dNpl:r.n.npl-st.npl};
  st=r.n; phase="result"; render(); window.scrollTo({top:0,behavior:"smooth"});
}
function renderResult(){
  const stamp=last.direct?"決定":last.adopted===true?"採用":last.adopted===false?"却下":"決";
  const chips=[];
  if(last.dNpl>=8) chips.push(`<span class="chip hid">見えない負債 ▲</span>`);
  if(last.dNpl<=-8) chips.push(`<span class="chip hid">見えない負債 ▼</span>`);
  const endCh=CHAPTERS.some(c=>c.to===last.i);
  const nextLabel=!endCh?"次の出来事へ":last.i===EVENTS.length-1?"10年の総括へ":"章末レポートへ";
  $("main").innerHTML=`<article class="doc">
    <div class="stamp" aria-label="${stamp}">${stamp}</div>
    <div class="date">${last.when}</div>
    <h2>${last.title}</h2>
    <div class="sesou">あなたの判断｜${esc(last.t)}</div>
    <p class="res">${last.res}</p>
    ${last.extra?`<p class="extra">${last.extra}</p>`:""}
    ${chips.length?`<div class="chips">${chips.join("")}</div>`:""}
    ${last.memo?`<div class="pager" role="status"><span>ｹﾂﾀﾞﾝ ｶﾞ ｷｵｸ ｻﾚﾀ</span><small>${esc(last.memo)}</small></div>`:""}
    <div class="row"><button class="btn" id="next">${nextLabel}</button></div>
  </article>`;
  $("next").onclick=()=>{phase=!endCh?"event":last.i===EVENTS.length-1?"final":"report";prev=null;render();window.scrollTo({top:0,behavior:"smooth"})};
}
function risk(p){return p>=45?["h","高"]:p>=20?["m","中"]:["l","低"]}
function memoList(list){return list.length?`<ul class="memos">${list.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:`<p class="note">なし</p>`}
function tableRows(){return METRICS.map(m=>`<tr><td>${m.lb}</td><td class="n">${m.fmt(m.f(st))}</td><td class="n">${m.fmt(m.f(HIST))}</td></tr>`).join("")}
function chMemos(c){const y=[1989,1993,1996][c.n-1],y2=[1992,1995,1999][c.n-1];return st.memos.filter(m=>{const v=+m.slice(0,4);return v>=y&&v<=y2})}
function goNext(){
  const n=st.step;
  st=vindicate(st); phase="event"; render(); window.scrollTo({top:0,behavior:"smooth"});
  const fresh=st.vind.filter(v=>!prevVind.includes(v));
  if(fresh.length){
    const box=document.createElement("div");box.className="pager";box.setAttribute("role","status");
    box.innerHTML=`<span>ｼﾝｹﾞﾝ ｶﾞ ﾐﾅｵｻﾚﾀ</span><small>${esc(fresh.join("、"))}が正しかったと評価され、信頼が上がった</small>`;
    $("main").prepend(box);
  }
}
let prevVind=[];
function renderReport(){
  const c=curCh();
  if(c.n===1){
    const [rc,rl]=risk(pressure(st)), [hc,hl]=risk(pressure(HIST));
    const verdict=rc==="l"?"傷は浅い。あなたの日本は、90年代後半の嵐をくぐり抜けられるかもしれない。":rc==="m"?"火種は残った。90年代後半、どこかで炎が上がるだろう。":"巨大な負債が眠っている。このままなら90年代後半、金融危機は避けられない。";
    $("main").innerHTML=`<article class="doc">
      <div class="stamp">章末</div>
      <div class="date">平成4年（1992年）末</div>
      <h2>第1章 報告書</h2>
      <p class="verdict">${verdict}</p>
      <div class="sec"><h3>隠れていた数字</h3>
        <p class="res">銀行の不良債権（推計）は <b>${Math.round(st.npl*1.2)}兆円</b>。史実どおりに進めた場合は ${Math.round(HIST.npl*1.2)}兆円。<br>
        このまま進んだ場合の、1997年の金融危機の危険度：<span class="risk ${rc}">${rl}</span>（史実ルート：<span class="risk ${hc}">${hl}</span>）</p></div>
      <div class="sec"><h3>記憶された決断</h3>${memoList(chMemos(c))}</div>
      ${st.rejected.filter(r=>RIGHT.includes(r)).length?`<p class="note">却下されたあなたの進言のなかに、のちに正しかったと分かるものがある。第2章の冒頭で信頼が回復する。</p>`:""}
      ${st.crisis?`<p class="note">火山対応で整えた危機管理の備えは、1995年に試される。</p>`:""}
      <div class="row"><button class="btn" id="go">第2章へ進む</button><button class="btn ghost" id="again">最初からやり直す</button></div>
    </article>`;
  } else {
    const npHint=st.npl>=40?"銀行の不良債権は、見えない場所で膨らみ続けている。":st.npl>=20?"銀行の不良債権は、まだくすぶっている。":"銀行の傷は、おおむね癒えている。";
    $("main").innerHTML=`<article class="doc">
      <div class="stamp">章末</div>
      <div class="date">平成7年（1995年）末</div>
      <h2>第2章 報告書</h2>
      <p class="verdict">あなたは今、${roleLabel(st)}。${st.path==="new"?"古巣を割った過去は、党内でまだ語り草だ。":st.role==="min"?"金融・財政の舵は、あなたの手にある。":"表舞台に立つ日を待っている。"}</p>
      <div class="sec"><h3>次の章への火種</h3><ul class="memos">
        <li>${npHint}</li>
        <li>${st.crisis>=2?"官邸の危機管理は、史実より一段強い。":st.crisis===1?"危機管理の備えは、わずかに史実を上回る。":"危機管理の備えは、史実と変わらない。"}</li>
        <li>雇用は ${st.jobs}（史実ルート ${HIST.jobs}）。</li></ul></div>
      <div class="sec"><h3>記憶された決断</h3>${memoList(chMemos(c))}</div>
      <div class="row"><button class="btn" id="go">第3章へ進む</button><button class="btn ghost" id="again">最初からやり直す</button></div>
    </article>`;
  }
  $("go").onclick=()=>{prevVind=st.vind.slice();goNext()};
  $("again").onclick=()=>start({});
}
function renderFinal(){
  const fcText={h:"大手証券・銀行が相次いで破綻し、本格的な金融危機に陥った。",m:"中堅の破綻が続いたが、大手の連鎖破綻は避けられた。",l:"アジア通貨危機のなかでも、日本の金融は持ちこたえた。"}[st.fc]||"";
  const tfr=clamp(1.36+(st.jobs-HIST.jobs)*.006+(st.youth-HIST.youth)*.06-(st.fc==="h"?.03:st.fc==="l"?-.04:0),1.1,1.9).toFixed(2);
  const score=(st.fc==="l"?2:st.fc==="m"?1:0)+(st.jobs>=HIST.jobs+8?1:0)+(st.youth>=1?1:0);
  const verdict=score>=3?"失われるはずだった10年を、あなたは取り戻しつつある。":score>=1?"史実とは違う道を歩み始めた。だが、平成の傷はまだ深い。":"平成の最初の10年は、ほぼ史実どおりに過ぎていった。";
  const pm=st.path==="new"?"古巣を割った過去が重く、首相への道は険しい。別の道を探すことになる。":st.trust>=60?"党内で、次の首相候補の筆頭に名前が挙がっている。":st.trust>=40?"首相候補の一人として、名前が挙がり始めた。":"党内の評価は低い。首相の座は遠い。";
  const has=m=>st.memos.includes(m);
  const seeds=[
    st.crisis>=2?"官邸の危機管理は史実より強い。2011年の大震災で、初動が変わるかもしれない。":"危機管理の備えは史実並み。2011年の大震災の初動は、史実に近くなりそうだ。",
    st.nuclear>=2?"独立した原子力規制機関がある。2011年の原発事故の規模が変わる可能性がある。":st.nuclear===1?"原子力推進にブレーキがかかった。エネルギー政策は史実と違う道をたどる。":"原子力の規制と推進は同じ役所のまま。2011年への最大の伏線が残っている。",
    st.youth>=1?"若者の雇用を支えた。令和の出生率と人手不足に、良い影響が出そうだ。":"就職氷河期の世代が生まれた。令和の少子化に影を落とすだろう。",
    st.it?"行政と学校のIT化に早くから投資した。コロナ禍とAI時代に、その差が出るかもしれない。":"行政のIT化は手つかず。コロナ禍で、その遅れが表面化しそうだ。",
    st.food?"コメの備蓄制度が早くから整っている。令和の米騒動は、穏やかに済むかもしれない。":"コメの備えは史実並み。令和の米騒動は、史実に近い形で起きそうだ。",
    ...(st.fiscal<20?["財政余力がほとんど残っていない。2000年代は、増税か歳出削減かの苦しい選択が続く。"]:[]),
    has("1994 中選挙区制を維持")?"中選挙区制が残った。2000年代も、派閥政治が続くだろう。":has("1994 比例重視の選挙制度")?"比例重視の制度で、連立政治が当たり前になる。":"小選挙区中心の制度で、2009年の政権交代も起きうる。"
  ];
  $("main").innerHTML=`<article class="doc">
    <div class="stamp">総括</div>
    <div class="date">平成11年（1999年）末</div>
    <h2>最初の10年 報告書</h2>
    <p class="verdict">${verdict}</p>
    <div class="sec"><h3>金融</h3><p class="res">${fcText}銀行の不良債権（推計）は <b>${Math.round(st.npl*1.2)}兆円</b>（史実ルート ${Math.round(HIST.npl*1.2)}兆円）。</p></div>
    <div class="sec"><h3>1999年末の日本</h3><div class="tbl"><table><thead><tr><th>指標</th><th class="n">あなた</th><th class="n">史実ルート</th></tr></thead><tbody>${tableRows()}</tbody></table></div>
      <p class="res">令和元年（2019年）の出生率の予測：<b>${tfr}</b>（史実は1.36）</p></div>
    <div class="sec"><h3>あなたのキャリア</h3><p class="res">${roleLabel(st)}として平成12年を迎える。${pm}</p></div>
    <div class="sec"><h3>令和への伏線</h3><ul class="memos">${seeds.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="sec"><h3>記憶された決断</h3>${memoList(st.memos)}</div>
    <div class="pager"><span>ﾂｷﾞﾊ 2000 ｼﾝｾｲｷ</span><small>第4章以降は未実装</small></div>
    <div class="row"><button class="btn ghost" id="again">最初からやり直す</button></div>
  </article>`;
  $("again").onclick=()=>start({});
}
let confirmRestart=false;
function renderRestart(){
  const el=$("restart");
  el.innerHTML=confirmRestart
    ?`<span>これまでの進行が消えます。最初から始めますか？</span><button class="yes" id="rsYes">最初から始める</button><button id="rsNo">続ける</button>`
    :`<button id="rsAsk">最初から始める</button>`;
  if(confirmRestart){
    $("rsYes").onclick=()=>{confirmRestart=false;prevVind=[];start({});window.scrollTo({top:0,behavior:"smooth"})};
    $("rsNo").onclick=()=>{confirmRestart=false;renderRestart()};
  } else $("rsAsk").onclick=()=>{confirmRestart=true;renderRestart();$("rsYes").focus()};
}
function render(){
  renderRestart(); renderTrack(); renderBoard();
  if(phase==="event") renderEvent(); else if(phase==="result") renderResult(); else if(phase==="report") renderReport(); else renderFinal();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
